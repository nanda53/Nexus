services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/core_banking
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super_secret_jwt_key_for_demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started